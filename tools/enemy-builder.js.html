    const g=cv.getContext("2d");g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
    if(m){if(!bb||[1,6,15,35,70].includes(bbF)){try{bb=mpUnion(bb,mpMeasure(m))}catch(e){}}bbF++;
      if(bb){const bw=bb.x1-bb.x0,bh=bb.y1-bb.y0,k=Math.min(w*.8/bw,h*.8/bh,3);g.save();g.translate(w/2-(bb.x0+bb.x1)/2*k,h*.9-bb.y1*k);g.scale(k,k);try{drawMech(g,0,0,1,m,0)}catch(e){}g.restore()}}}
  requestAnimationFrame(loop)}
function msg(t){$("bmsg").textContent=t}
$("bld").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.f&&BL.sel)return setSel(BL.sel,t.dataset.f,t.type=="checkbox"?t.checked:t.value);
  if(t.id=="bnm"){commit();return draw()}
  if(t.dataset.p){BL.d.p[t.dataset.p]=Math.max(1,+t.value||100);commit();return stats()}
  if(t.dataset.sp){S.designs=S.designs||{};const cf=S.designs._cfg=S.designs._cfg||JSON.parse(JSON.stringify(CAMPD._cfg||{stars:[{},JSON.parse(JSON.stringify(STARP0[1])),JSON.parse(JSON.stringify(STARP0[2]))]}));cf.stars=cf.stars||[{},{},{}];cf.stars[+t.dataset.sp]=Object.assign({},PCT0,STARP0[+t.dataset.sp],cf.stars[+t.dataset.sp]||{});cf.stars[+t.dataset.sp][t.dataset.f2]=Math.max(1,+t.value||100);save();return msg("Star percentages saved.")}});
$("bld").addEventListener("input",e=>{if(e.target.id=="bps"&&PK)pkDraw()});
$("bld").addEventListener("mouseover",e=>{const t=e.target.closest(".pt,.sq");let k=null,id=null;if(t&&t.classList.contains("pt")&&PK&&t.dataset.pid){k=PK.k;id=+t.dataset.pid}else if(t&&t.classList.contains("sq")&&!PK){const it=getIt(t.dataset.sq);if(it&&it.id!=null){k=kindOf(t.dataset.sq);id=it.id}}if(k)window.evtCard(k,id,e);else window.evtHide()});
$("bld").addEventListener("mousemove",e=>{const t=e.target.closest(".pt,.sq");if(!t)window.evtHide()});
$("bld").addEventListener("mouseleave",()=>window.evtHide());
$("bld").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  window.evtHide();if(b.dataset.sq){const s=b.dataset.sq,it=getIt(s);if(it&&it.id!=null){BL.sel=BL.sel==s?null:s;return draw()}BL.sel=s;draw();return openPick(s)}
  if(b.dataset.f=="pick"&&BL.sel)return openPick(BL.sel);
  if(b.dataset.f=="rm"&&BL.sel)return setSel(BL.sel,"rm");
  if(b.id=="bpc"){PK=null;return $("bpk").hidden=true}
  if(b.dataset.pid!=null&&PK){const s=PK.s;PK=null;$("bpk").hidden=true;return setSel(s,"id",b.dataset.pid)}
  if(b.dataset.mi!=null){BL.mi=+b.dataset.mi;BL.k=WV(BL.mi).length-1;load();return draw()}
  if(b.dataset.w!=null){BL.k=+b.dataset.w;load();return draw()}
  if(b.dataset.pd!=null){BL.pd=+b.dataset.pd;return draw()}
  if(b.id=="bx")return $("bld").hidden=true;
  if(b.id=="bcl"){const kk=keyOf(BL.mi,BL.k);if(S.designs)delete S.designs[kk];save();load();draw();return msg("Wave cleared.")}
  if(b.id=="bex"){const all=Object.assign({},CAMPD,S.designs||{});$("bjs").value=JSON.stringify({designs:all},null,1);return msg(Object.keys(all).length+" entries exported below (saved ones plus the ones already in the game).")}
  if(b.id=="bcp"){$("bjs").select();try{navigator.clipboard.writeText($("bjs").value)}catch(_){document.execCommand&&document.execCommand("copy")}return msg("Copied.")}
  if(b.id=="bim"){importDesigns($("bjs").value);load();draw();return msg("Imported.")}});
window.openBuilder=()=>{if(BL.mi<0)BL.mi=0;BL.k=Math.min(BL.k,WV(BL.mi).length-1);load();$("bld").hidden=false;draw();const a=$("bml").querySelector(".on");if(a)a.scrollIntoView({block:"nearest"});if(!rafOn){rafOn=true;requestAnimationFrame(loop)}};
{const b=$("edb");if(b)b.onclick=()=>window.openBuilder()}
if(location.hash=="#builder")setTimeout(window.openBuilder,800);
})();
</script>
