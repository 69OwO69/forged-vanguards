<script id="bldjs">
/* ---------- Enemy builder: pick a campaign mission + wave, equip it, see real stats, export JSON for the game's code ---------- */
(()=>{
const $=id=>document.getElementById(id);
const SL=["Torso","Legs","Top 1","Top 2","Left 1","Left 2","Right 1","Right 2","Drone"];
let BL={mi:0,k:0,d:null};
const keyOf=(mi,k)=>{const m=MIS[mi];return k==WV(mi).length-1?String(m.id):m.id+":"+k};
const blank=()=>({t:null,l:null,w:{},mul:1});
const load=()=>{const kk=keyOf(BL.mi,BL.k),d=(S.designs&&S.designs[kk])||(typeof CAMPD!="undefined"&&CAMPD[kk]);BL.d=d?JSON.parse(JSON.stringify(d)):blank();if(BL.d.mul==null)BL.d.mul=1};
const maxLv=(k,id)=>CAPL[RI(k,id)]||10;
const opts=(k,slot)=>{const out=[];const src=k=="w"?W:K[k];for(const i in src){const it=src[i];if(!it||it.gone)continue;if(k=="w"){const dr=!!it.drone;if(slot==6?!dr:dr)continue;if(slot<2&&it.side)continue}out.push([+i,it.n||("#"+i)])}return out.sort((a,b)=>a[1].localeCompare(b[1]))};
function build(){const d=BL.d;if(!(d.t||d.l||Object.keys(d.w).length))return null;try{const dd=JSON.parse(JSON.stringify(d));if(dd.t&&dd.t.id==null)dd.t=null;return specMech(dd)}catch(e){console.error(e);return null}}
const css=`#bld{position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;background:#07111c;color:#e6eefb;font:14px/1.3 ACE,Arial,sans-serif;display:flex;flex-direction:column}
#bld[hidden]{display:none}#bld *{box-sizing:border-box}
#bld .bh{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0e2a44;border-bottom:3px solid #0a6aa8;flex:none}
#bld .bh b{font-size:20px;flex:1}#bld button,#bld select,#bld input,#bld textarea{font:inherit;color:#e6eefb;background:#12263a;border:1px solid #2f5b82;border-radius:6px;padding:5px 9px}
#bld button{cursor:pointer}#bld button:hover{background:#1b3a58}#bld .go{background:#2e8a2a;border-color:#6ad060}
#bld .bm{flex:1;display:flex;gap:14px;padding:14px;min-height:0}
#bld .col{background:#0b1b2b;border:2px solid #17496f;border-radius:8px;padding:12px;overflow:auto;min-height:0}
#bld .col h3:not(:first-child){margin-top:18px!important}#bld .col .muted{margin-top:6px}#bld .col{display:block!important;justify-content:flex-start!important;gap:0!important}#bld .c1{width:270px;flex:none}#bld .c2{flex:1;min-width:0}#bld .c3{width:420px;flex:none}
#bld h3{margin:0 0 8px!important;padding:0!important;height:auto!important;line-height:1.2!important;font-size:15px;color:#7fb4dc;font-weight:400;letter-spacing:1px}
#bld .wt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}#bld .wt button.on{background:#0a6aa8;border-color:#7fd0ff}
#bld .sl{display:grid;grid-template-columns:70px 1fr 64px 40px 30px;gap:6px;align-items:center;margin-bottom:7px}
#bld .sl select{min-width:0;width:100%}#bld .sl input[type=number]{width:100%}
#bld canvas{width:100%;height:240px;background:#162636;border-radius:6px;display:block}
#bld table{width:100%;border-collapse:collapse;margin-top:8px}#bld td,#bld th{padding:3px 6px;border-bottom:1px solid #17496f;text-align:left;font-weight:400}
#bld .st{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:10px}#bld .st span:nth-child(even){text-align:right;color:#ffd24a}
#bld textarea{width:100%;height:100px;font:12px monospace;resize:vertical}#bld .muted{color:#7f98b0;font-size:12px}`;
document.head.insertAdjacentHTML("beforeend","<style>"+css+"</style>");
document.body.insertAdjacentHTML("beforeend",`<div id="bld" hidden><div class="bh"><b>ENEMY BUILDER</b><span class="muted">Build every wave of every campaign mission. Saves here instantly; Export to send the designs to be built into the game.</span><button id="bx">Close</button></div>
<div class="bm"><div class="col c1"><h3>MISSION</h3><select id="bmi" style="width:100%"></select><h3 style="margin-top:14px">WAVE</h3><div class="wt" id="bwt"></div>
<h3>STAT MULTIPLIER</h3><input id="bmul" type="number" min="0.1" max="20" step="0.05" style="width:100%"><div class="muted" style="margin-top:6px">Applied on top of the items. Difficulty stars then multiply it again: ★ ×1, ★★ ×1.6, ★★★ ×2.4.</div>
<h3 style="margin-top:14px">THIS WAVE</h3><button id="bsv" class="go" style="width:100%">Save</button><button id="bcl" style="width:100%;margin-top:6px">Clear this wave</button><div class="muted" id="bmsg" style="margin-top:8px"></div></div>
<div class="col c2"><h3>EQUIPMENT</h3><div id="bsl"></div><div class="muted">Modules were removed from the game, so enemies have no module slots.</div></div>
<div class="col c3"><h3>PREVIEW</h3><canvas id="bcv"></canvas><div class="st" id="bst"></div><table id="bwp"></table>
<h3 style="margin-top:16px">EXPORT / IMPORT</h3><textarea id="bjs" spellcheck="false"></textarea><div style="display:flex;gap:6px;margin-top:6px"><button id="bex">Export all</button><button id="bcp">Copy</button><button id="bim">Import</button></div></div></div></div>`);
const sel=(arr,v)=>arr.map(([i,n])=>`<option value="${i}"${i==v?" selected":""}>${n}</option>`).join("");
let rafOn=false,bb=null,bbF=0;
function draw(){const d=BL.d;
  $("bwt").innerHTML=WV(BL.mi).map((s,k)=>`<button data-w="${k}" class="${k==BL.k?"on":""}">${k+1}${s.last?(MIS[BL.mi].boss?" · boss":" · last"):""}${(S.designs&&S.designs[keyOf(BL.mi,k)])?" ✔":""}</button>`).join("");
  $("bmul").value=d.mul;
  $("bsl").innerHTML=SL.map((nm,si)=>{const it=si==0?d.t:si==1?d.l:d.w[si-2],k=si==0?"t":si==1?"l":"w",id=it&&it.id!=null?it.id:"";
    return `<div class="sl" data-s="${si}"><span>${nm}</span><select data-f="id"><option value="">— empty —</option>${sel(opts(k,si-2),id)}</select><input type="number" data-f="lv" min="1" max="${id!==""?maxLv(k,id):50}" value="${it?it.lv||1:1}" ${id===""?"disabled":""}><label title="Shiny"><input type="checkbox" data-f="sh" ${it&&it.sh?"checked":""} ${id===""?"disabled":""}>✨</label><button data-f="rm" title="Remove">×</button></div>`}).join("");
  stats()}
function stats(){const m=build(),cv=$("bcv"),ex=document.getElementById("bst");bb=null;bbF=0;
  if(!m){$("bst").innerHTML="";$("bwp").innerHTML="";return}
  const d=BL.d,wt=(d.t?(K.t[d.t.id]||{}).w||0:0)+(d.l?(K.l[d.l.id]||{}).w||0:0)+Object.values(d.w).reduce((a,x)=>a+(x&&W[x.id]?W[x.id].w||0:0),0),cap=d.t&&K.t[d.t.id]?K.t[d.t.id].cap:0;
  const F=n=>Math.round(n).toLocaleString();
  $("bst").innerHTML=[["Hit points",F(m.max)],["Energy capacity",F(m.enCap)],["Energy regen",F(m.enMax)],["Heat capacity",F(m.hc)],["Cooling",F(m.cool)],["Weight",F(wt)+(cap?" / "+F(cap):"")]].map(([a,b])=>`<span>${a}</span><span>${b}</span>`).join("");
  $("bwp").innerHTML="<tr><th>Weapon</th><th>Damage</th><th>Energy</th><th>Heat</th></tr>"+m.weps.map(w=>{const n=w.shots>1?w.shots:1,lo=Math.round(w.dr[0]*n),hi=Math.round(w.dr[1]*n);return `<tr><td>${w.n}</td><td>${lo==hi?F(lo):F(lo)+"-"+F(hi)}</td><td>${F(w.en||0)}</td><td>${F(w.ht||0)}</td></tr>`}).join("");
  BL.m=m}
function loop(){if($("bld").hidden){rafOn=false;return}const cv=$("bcv"),m=BL.m;
  if(cv){const r=cv.getBoundingClientRect(),dp=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*dp),h=Math.round(r.height*dp);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
    const g=cv.getContext("2d");g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
    if(m){if(!bb||[1,6,15,35,70].includes(bbF)){try{bb=mpUnion(bb,mpMeasure(m))}catch(e){}}bbF++;
      if(bb){const bw=bb.x1-bb.x0,bh=bb.y1-bb.y0,k=Math.min(w*.8/bw,h*.8/bh,3);g.save();g.translate(w/2-(bb.x0+bb.x1)/2*k,h*.9-bb.y1*k);g.scale(k,k);try{drawMech(g,0,0,1,m,0)}catch(e){}g.restore()}}}
  requestAnimationFrame(loop)}
function msg(t){$("bmsg").textContent=t}
function setSel(si,f,v){const d=BL.d,k=si==0?"t":si==1?"l":"w";let it=si==0?d.t:si==1?d.l:d.w[si-2];
  if(f=="rm"||(f=="id"&&v==="")){if(si==0)d.t=null;else if(si==1)d.l=null;else delete d.w[si-2]}
  else{if(!it){it={id:null,lv:1,sh:false};if(si==0)d.t=it;else if(si==1)d.l=it;else d.w[si-2]=it}
    if(f=="id"){it.id=+v;it.lv=Math.min(it.lv||1,maxLv(k,it.id))}if(f=="lv")it.lv=Math.max(1,Math.min(maxLv(k,it.id),+v||1));if(f=="sh")it.sh=!!v}
  draw()}
$("bld").addEventListener("change",e=>{const t=e.target,row=t.closest(".sl");if(row&&t.dataset.f)return setSel(+row.dataset.s,t.dataset.f,t.type=="checkbox"?t.checked:t.value);
  if(t.id=="bmi"){BL.mi=+t.value;BL.k=WV(BL.mi).length-1;load();draw()}if(t.id=="bmul"){BL.d.mul=Math.max(.1,+t.value||1);stats()}});
$("bld").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.f=="rm")return setSel(+b.closest(".sl").dataset.s,"rm");
  if(b.dataset.w!=null){BL.k=+b.dataset.w;load();return draw()}
  if(b.id=="bx")return $("bld").hidden=true;
  if(b.id=="bsv"){const kk=keyOf(BL.mi,BL.k),d=BL.d;S.designs=S.designs||{};if(!(d.t||d.l||Object.keys(d.w).length)){delete S.designs[kk]}else S.designs[kk]=JSON.parse(JSON.stringify(d));save();draw();return msg("Saved. The campaign now uses this enemy on this browser.")}
  if(b.id=="bcl"){const kk=keyOf(BL.mi,BL.k);if(S.designs)delete S.designs[kk];save();load();draw();return msg("Cleared.")}
  if(b.id=="bex"){$("bjs").value=JSON.stringify({designs:S.designs||{}},null,1);return msg((Object.keys(S.designs||{}).length)+" designs exported below.")}
  if(b.id=="bcp"){$("bjs").select();try{navigator.clipboard.writeText($("bjs").value)}catch(_){document.execCommand&&document.execCommand("copy")}return msg("Copied.")}
  if(b.id=="bim"){importDesigns($("bjs").value);load();draw();return msg("Imported.")}});
window.openBuilder=()=>{if(BL.mi<0)BL.mi=0;$("bmi").innerHTML=MIS.map((m,i)=>`<option value="${i}">${i+1}. ${m.n}${m.boss?" (boss)":""}</option>`).join("");$("bmi").value=BL.mi;BL.k=Math.min(BL.k,WV(BL.mi).length-1);load();$("bld").hidden=false;draw();if(!rafOn){rafOn=true;requestAnimationFrame(loop)}};
{const b=$("edb");if(b)b.onclick=()=>window.openBuilder()}
if(location.hash=="#builder")setTimeout(window.openBuilder,800);
})();
</script>
