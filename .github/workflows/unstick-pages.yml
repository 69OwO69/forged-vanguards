name: unstick-pages
on:
  push:
    paths: [".github/workflows/unstick-pages.yml"]
permissions:
  pages: write
  deployments: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set +e
          n(){ echo "::notice title=$1::$(echo "$2" | head -c 500 | tr '\n' ' ')"; }
          n pages "$(gh api repos/$R/pages 2>&1)"
          n latest "$(gh api repos/$R/pages/builds/latest 2>&1)"
          n builds "$(gh api repos/$R/pages/builds --jq '.[0:3][]|"\(.status) \(.commit[0:7]) \(.created_at) err=\(.error.message)"' 2>&1)"
          n trigger "$(gh api -X POST repos/$R/pages/builds 2>&1)"
          sleep 25
          n after "$(gh api repos/$R/pages/builds/latest 2>&1)"
