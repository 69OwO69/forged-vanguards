name: unstick-pages
on:
  push:
    paths: [".github/workflows/unstick-pages.yml"]
permissions:
  pages: write
  deployments: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and cancel
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set +e
          S=9c032a01e6e827d7a10a76302e1b009ae049cafb
          a=$(gh api repos/$R/pages/deployments/$S 2>&1 | head -c 400 | tr '\n' ' ')
          echo "::notice title=status::$a"
          b=$(gh api -X POST repos/$R/pages/deployments/$S/cancel 2>&1 | head -c 400 | tr '\n' ' ')
          echo "::notice title=cancel::$b"
          c=$(gh api "repos/$R/deployments?environment=github-pages&per_page=5" --jq '.[]|"\(.id) \(.sha[0:7]) \(.created_at)"' 2>&1 | head -c 400 | tr '\n' ';')
          echo "::notice title=deployments::$c"
          for id in $(gh api "repos/$R/deployments?environment=github-pages&per_page=3" --jq '.[].id' 2>/dev/null); do d=$(gh api repos/$R/deployments/$id/statuses --jq '.[0]|"\(.state) \(.created_at)"' 2>&1 | head -c 150); echo "::notice title=dep $id::$d"; done
